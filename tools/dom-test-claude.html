<!doctype html>
<!-- claude.ai adapter, offline (Step 4). Fixture DOM from the 2026-11-17 probe (docs/CLAUDEAI.md).
     Run: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --user-data-dir="$(mktemp -d)" \
          --allow-file-access-from-files --virtual-time-budget=5000 --dump-dom "file://$PWD/tools/dom-test-claude.html" | grep -E "PASS|FAIL|passed" -->
<html class="light"><head><meta charset="utf-8"><title>…</title></head><body>
<div data-autoscroll-container="true" style="height:400px;overflow-y:auto;width:600px">
  <div data-testid="transcript-list" style="display:flex;flex-direction:column">
    <div role="feed">
      <div data-testid="transcript-sizer" data-rocksteady-sizer="" data-sizer-excess="0" style="position:relative;width:100%">
        <div data-testid="transcript-spacer" style="height:120px"></div>
        <div data-testid="transcript-row" data-index="4" data-perf-row="human" style="display:flow-root;position:relative"><div><div data-cds="UserMessage" data-turn-key="01a1d45d-47f9-7000-8000-000000000001"><p>用三句话介绍一下长城</p></div></div></div>
        <div data-testid="transcript-row" data-index="5" data-perf-row="assistant" style="display:flow-root;position:relative"><div role="article"><div data-cds="AssistantMessage" data-testid="assistant-message" data-turn-key="01a1d45d-47f9-7000-8000-000000000001-hub-reply" data-is-streaming="false"><div data-cds="TurnStatus" data-state="done"><div>Searched the web</div></div><div class="prose" data-cds="Prose"><p>长城是中国古代的军事防御工程。</p><pre><code class="language-python">print("hi")
    x = 1</code></pre></div></div><div data-cds="MessageActions"><button data-testid="action-bar-retry">↻</button></div></div></div>
        <div data-testid="transcript-row" data-index="6" data-perf-row="human" style="display:flow-root;position:relative"><div><div data-cds="UserMessage" data-turn-key="01a1d45d-47f9-7000-8000-000000000002"><p>Regarding this part of your response: …</p></div></div></div>
        <div data-testid="transcript-row" data-index="7" data-perf-row="assistant" style="display:flow-root;position:relative"><div role="article"><div data-cds="AssistantMessage" data-testid="assistant-message" data-turn-key="01a1d45d-47f9-7000-8000-000000000002-hub-reply" data-is-streaming="true"><div class="prose" data-cds="Prose"><p>Popup answer…</p></div></div></div></div>
        <div data-testid="transcript-spacer" style="height:0px"></div>
      </div>
    </div>
  </div>
</div>
<div id="dock"><div><div contenteditable="true" role="textbox" data-cds="Editor" data-testid="chat-input" class="tiptap ProseMirror"><p>draft</p></div></div><button type="button" disabled data-testid="chat-input-send" aria-label="Send message">↑</button></div>
<pre id="out"></pre>
<script>window.JR = {};</script>
<script src="../src/site-hosts.js"></script>
<script src="../src/sites/claude.js"></script>
<script>
var out = [], failed = 0, pending = [];
function check(name, ok, got) { if (!ok) failed++; out.push((ok ? "PASS " : "FAIL ") + name + (ok ? "" : "  got " + got)); }
var S = JR.sites.claude, K1 = "01a1d45d-47f9-7000-8000-000000000001", K2 = "01a1d45d-47f9-7000-8000-000000000002";
check("Step 4a: early-hide selector (site-hosts.js) = turnSelector", JR_HOST.all.claude.hide(K1) === S.turnSelector(K1), JR_HOST.all.claude.hide(K1));
function row(i) { return document.querySelector('[data-index="' + i + '"]'); }

// --- Turns ---
check("turns are the assistant rows", S.turns().map(function (t) { return t.getAttribute("data-index"); }).join() === "5,7");
check("turnKey: the user message uuid (no -hub-reply)", S.turnKey(row(5)) === K1, S.turnKey(row(5)));
check("turnOf: a node in the human row → its answer row", S.turnOf(row(4).querySelector("p")) === row(5));
check("turnOf: a node in the answer → the answer row", S.turnOf(row(5).querySelector("p")) === row(5));
check("findTurnByKey", S.findTurnByKey(K2) === row(7));
var hidden = Array.prototype.slice.call(document.querySelectorAll(S.turnSelector(K1))).map(function (r) { return r.getAttribute("data-index"); }).join();
check("turnSelector: both rows of the Q&A, nothing else", hidden === "4,5", hidden);
check("userText: the question before the answer", S.userText(row(5)) === "用三句话介绍一下长城", JSON.stringify(S.userText(row(5))));
check("assistantBodies: the reply prose, not the TurnStatus line", S.assistantBodies(row(5)).length === 1 && S.assistantText(row(5)).indexOf("长城是") === 0 && S.assistantText(row(5)).indexOf("Searched") === -1, S.assistantText(row(5)));
check("frameTurn / frameScroller work on another document (render frame)", S.frameTurn(document, K1) === row(5) && !!S.frameScroller(document) && S.frameTurnCount(document) === 4);

// --- Composer ---
check("composer: the tiptap editor", S.composer() === document.querySelector("[data-testid=chat-input]"));
check("composerText", S.composerText(S.composer()) === "draft");
check("sendButton: null while Claude keeps it disabled", S.sendButton(S.composer()) === null);
document.querySelector("[data-testid=chat-input-send]").disabled = false;
check("sendButton: the button once enabled", !!S.sendButton(S.composer()));
check("isGenerating: a reply marked streaming", S.isGenerating() === true);
row(7).querySelector("[data-cds=AssistantMessage]").setAttribute("data-is-streaming", "false");
check("isGenerating: none streaming, no stop button", S.isGenerating() === false);

// --- Pages ---
check("conversationId", S.conversationId("/chat/938ecde8-1932-4480-8c7b-2b48e553e549") === "938ecde8-1932-4480-8c7b-2b48e553e549" && S.conversationId("/recents") === null);
check("chatUrl: the page the render frame loads", S.chatUrl("abc") === "/chat/abc");
check("popupHost: the transcript column", S.popupHost(row(5)) === document.querySelector("[data-testid=transcript-list]"));

// --- The flash's root cause (claude.ai's rocksteady skips a row whose border box is 0×0) ---
// rocksteady: if (box.blockSize === 0 && box.inlineSize === 0) { skip: keep the old height } (docs/CLAUDEAI.md §5)
function rocksteadySkips(box) { return box.blockSize === 0 && box.inlineSize === 0; }
(function () { // the border box rocksteady would get from its ResizeObserver, read directly (headless Chrome delivers
  // observations late now and then: a test waiting for them could hang)
  var none = row(6), ours = row(7);
  var st = document.createElement("style");
  st.textContent = '[data-index="6"] { display: none !important } [data-index="7"] { ' + S.hideDeclaration + " }";
  document.head.appendChild(st);
  function box(el) { var r = el.getBoundingClientRect(); return { blockSize: r.height, inlineSize: r.width }; }
  check("display:none → 0×0: rocksteady would skip it (the blank)", rocksteadySkips(box(none)), JSON.stringify(box(none)));
  check("hideDeclaration → height 0, width kept: measured as 0 (no blank)", !rocksteadySkips(box(ours)) && box(ours).blockSize === 0 && box(ours).inlineSize > 0, JSON.stringify(box(ours)));
  check("hideDeclaration: nothing of the row shows (0 px in the flow)", ours.getBoundingClientRect().height === 0 && row(5).getBoundingClientRect().bottom === document.querySelectorAll('[data-testid="transcript-spacer"]')[1].getBoundingClientRect().top, ours.getBoundingClientRect().height);
})();

// 2026-11-18 (Codex): the turn order comes from the conversation's data — the current branch's human messages, in order —
// and each question's answer (the one shown; its text parts only) for answers not on the page
pending.push((function () {
  var realFetch = window.fetch;
  Object.defineProperty(document, "cookie", { configurable: true, get: function () { return "a=1; lastActiveOrg=org1"; } });
  var asked = "";
  function msg(uuid, sender, parent, text) { return { uuid: uuid, sender: sender, parent_message_uuid: parent, content: [{ type: "text", text: text }] }; }
  window.fetch = function (url) {
    asked = url;
    var tool = msg("a1", "assistant", "h1", "found");
    tool.content.unshift({ type: "text", text: "\n```\nThis block is not supported on your current device yet.\n```\n" }); // a search step
    tool.content.push({ type: "tool_use", name: "web_search" }, { type: "text", text: "it" });
    return Promise.resolve({ ok: true, json: function () { return { current_leaf_message_uuid: "a2", chat_messages: [
      msg("h1", "human", "root", "Q1"), tool,
      msg("hx", "human", "a1", "edited away"), // an edited-away branch
      msg("h2", "human", "a1", "Q2"), msg("a2old", "assistant", "h2", "retried away"), msg("a2", "assistant", "h2", "A2")] }; } });
  };
  return S.fetchConversation("conv1").then(function (c) {
    check("fetchConversation: the current branch's questions in order", JSON.stringify(c.order) === '["h1","h2"]' && asked.indexOf("/api/organizations/org1/chat_conversations/conv1") === 0, JSON.stringify(c.order) + " " + asked);
    check("fetchConversation: each question's answer shown (not a retried-away one), text parts only, no search-step placeholders",
      c.turns.h2.answer === "A2" && c.turns.h2.question === "Q2" && c.turns.h1.answer === "found\n\nit" && !c.turns.hx, JSON.stringify(c.turns));
  }).finally(function () { window.fetch = realFetch; delete document.cookie; });
})());

Promise.all(pending).then(function () {
  (function () { // live 2026-11-17: claude.ai draws a message's paragraphs as <p>s; the parts must come back apart
    var row = document.createElement("div"); row.setAttribute("data-testid", "transcript-row");
    row.innerHTML = '<div data-cds="UserMessage" data-turn-key="pk"><p>Regarding this part of your response:<br>"a b."</p><p>Specifically: "a"</p><p>Q?</p><p>(For this response only: x)</p></div>';
    var ans = document.createElement("div"); ans.setAttribute("data-testid", "transcript-row");
    ans.innerHTML = '<div data-cds="AssistantMessage" data-turn-key="pk-hub-reply"><div data-cds="Prose">A</div></div>';
    document.body.appendChild(row); document.body.appendChild(ans);
    var t = S.userText(ans);
    check("userText: paragraphs come back separated by a blank line", /"a b\."\n\nSpecifically: "a"\n\nQ\?\n\n\(For/.test(t), JSON.stringify(t));
    row.remove(); ans.remove();
  })();
  (function () { // live 2026-11-18: a sent file's tile is inside the user message with its name as text
    var row = document.createElement("div"); row.setAttribute("data-testid", "transcript-row");
    row.innerHTML = '<div data-cds="UserMessage" data-turn-key="fk"><div data-cds="MessageAttachmentsImage" data-testid="file-thumbnail"><span>1794982711152_image.png</span><img src="data:,"></div><p>Q?</p></div>';
    var ans = document.createElement("div"); ans.setAttribute("data-testid", "transcript-row");
    ans.innerHTML = '<div data-cds="AssistantMessage" data-turn-key="fk-hub-reply"><div data-cds="Prose">A</div></div>';
    document.body.appendChild(row); document.body.appendChild(ans);
    check("userText: a sent file's tile is not part of the question", S.userText(ans) === "Q?", JSON.stringify(S.userText(ans)));
    var at = S.sentAttachments("fk");
    var plain = document.createElement("pre"); plain.innerHTML = '<code><span style="color: rgb(20, 24, 31)">def f():</span></code>';
    var col = document.createElement("pre"); col.innerHTML = '<code><span style="color: rgb(129, 0, 194)">def</span><span style="color: rgb(0, 81, 194)"> f</span></code>';
    check("codeColoured: one plain colour is not coloured, two token colours are", !S.codeColoured(plain) && S.codeColoured(col), S.codeColoured(plain) + " " + S.codeColoured(col));
    check("sentAttachments: the file's name (no timestamp) and image address", at.length === 1 && at[0].name === "image.png" && at[0].url === "data:,", JSON.stringify(at));
    row.remove(); ans.remove();
  })();
  out.push(failed ? failed + " FAILED" : "all passed");
  document.getElementById("out").textContent = out.join("\n");
  document.title = failed ? "FAIL" : "PASS";
});
</script></body></html>
