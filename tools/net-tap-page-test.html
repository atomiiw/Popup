<!doctype html>
<html><head><meta charset="utf-8"><title>RUNNING</title></head>
<body>
<pre id="out"></pre>
<script>window.onerror = function (m, u, l) { document.title = "FAIL"; document.getElementById("out").textContent = "FAIL error: " + m + " (line " + l + ")"; };</script>
<script>
// net-tap.js in a page, with ChatGPT's server faked (fetch stubbed before it loads): its history pages.
var calls = [];
var P = 'Regarding this part of your response:\n"x"\n\nwhy\n\n(For this response only: brief)';
function msg(id, role, text, ex) { return { id: id, author: { role: role }, content: { parts: [text] }, metadata: { turn_exchange_id: ex }, create_time: 1 }; }
function popupPair(n) { return [msg("pu" + n, "user", P, "e" + n), msg("pa" + n, "assistant", "a", "e" + n)]; }
var CONV = "6afbb274-2044-83e9-8e7d-12b5a352465b";
var pages = {
  A: { messages: popupPair(5).concat(popupPair(6)), page_info: { has_previous_page: true, has_next_page: true } },
  pu5: { messages: popupPair(3).concat(popupPair(4)), page_info: { has_previous_page: true, has_next_page: true } },       // before pu5
  pu3: { messages: [msg("u1", "user", "hello", "x1"), msg("a1", "assistant", "hi", "x1")].concat(popupPair(2)), page_info: { has_previous_page: false, has_next_page: true } }, // before pu3: the chat's start
  V: { messages: [msg("u9", "user", "q", "x9"), msg("a9", "assistant", "y", "x9")].concat(popupPair(10)), page_info: { has_previous_page: true, has_next_page: false } },
  E: { messages: popupPair(20), page_info: { has_previous_page: false, has_next_page: true } },
  u9: { messages: [msg("u7", "user", "p", "x7"), msg("a7", "assistant", "z", "x7")].concat(popupPair(8)), page_info: { has_previous_page: false, has_next_page: true } }, // before u9
};
var busy = 0; // 429s still to answer (too many requests)
window.fetch = function (input, init) {
  var url = String(typeof input === "string" ? input : input.url);
  calls.push({ url: url, headers: init && init.headers });
  if (busy && /before=/.test(url)) { busy--; return Promise.resolve(new Response('{"detail":"Too many requests"}', { status: 429 })); }
  var m = /before=([^&]+)/.exec(url), key = /page=([A-Z])/.exec(url);
  var page = key ? pages[key[1]] : m ? pages[decodeURIComponent(m[1])] : null;
  return Promise.resolve(new Response(JSON.stringify(page || { messages: [] }), { status: 200, headers: { "content-type": "application/json" } }));
};
</script>
<script src="../src/net-tap.js"></script>
<script>
var out = [], failed = 0;
function check(name, ok, got) { if (!ok) failed++; out.push((ok ? "PASS " : "FAIL ") + name + (ok ? "" : "  got " + got)); }
function ask(page) {
  calls = [];
  return window.fetch("https://chatgpt.com/backend-api/conversations/" + CONV + "/messages?page=" + page + "&num_turns=10", { method: "GET", headers: { Authorization: "Bearer t" } })
    .then(function (r) { return r.json(); });
}
ask("A").then(function (j) {
  var ids = j.messages.map(function (m) { return m.id; }).join();
  check("a page of only Popup Q&As: the pages before it are fetched until one keeps a message, given as that page",
    ids === "u1,a1" && j.page_info.has_previous_page === false && j.page_info.has_next_page === true, ids + " " + JSON.stringify(j.page_info));
  check("...asked before the oldest message of each, with the page's own login",
    calls.length === 3 && /before=pu5/.test(calls[1].url) && /before=pu3/.test(calls[2].url) && calls[1].headers && calls[1].headers.Authorization === "Bearer t",
    JSON.stringify(calls.map(function (c) { return c.url.replace(/^.*messages\?/, ""); })));
  busy = 1;
  return ask("A");
}).then(function (j) {
  check("an extra page answered 429 (too many requests): asked again a little later, the page filled",
    j.messages.map(function (m) { return m.id; }).join() === "u1,a1" && calls.length === 4, calls.length + " " + j.messages.length);
  return ask("V");
}).then(function (j) {
  // live 11-21: one question after nine Popup Q&As — the page showed that one turn, nothing to scroll, older ones never loaded
  check("a page keeping fewer turns than asked: the visible ones before it put before it (as if the Popup Q&As weren't there)",
    j.messages.map(function (m) { return m.id; }).join() === "u7,a7,u9,a9" && calls.length === 2 && j.page_info.has_previous_page === false && j.page_info.has_next_page === false,
    j.messages.map(function (m) { return m.id; }).join() + " " + calls.length + " " + JSON.stringify(j.page_info));
  return ask("E");
}).then(function (j) {
  check("a page of only Popup Q&As at the start of the chat: empty, nothing more fetched", j.messages.length === 0 && calls.length === 1, j.messages.length + " " + calls.length);
}).then(function () {
  // in Popup's render frame: ChatGPT's 10-turn history pages asked 100 at a time, nothing else; another frame: untouched
  function inFrame(cls) {
    return new Promise(function (done) {
      var f = document.createElement("iframe");
      if (cls) f.className = cls;
      f.srcdoc = '<script>window.seen=[];window.fetch=function(u){seen.push(String(typeof u==="string"?u:u.url));return Promise.resolve(new Response("{}"));};<\/script>' +
        '<script src="../src/net-tap.js"><\/script>';
      f.onload = function () {
        var w = f.contentWindow;
        w.fetch("/backend-api/conversations/" + CONV + "/messages?before=x&num_turns=10&include_has_versions=true");
        w.fetch("/backend-api/conversation/" + CONV);
        w.fetch("/backend-api/conversations/" + CONV + "?num_turns=10&include_has_versions=true");
        var told = 0; f.addEventListener("jr-copy-send-blocked", function () { told++; });
        w.fetch("/backend-api/f/conversation", { method: "POST", body: "{}" }).then(function () { return "sent"; }, function () { return "refused"; }).then(function (r) {
          var seen = w.seen.slice(); seen.send = r + " " + told; f.remove(); done(seen);
        });
      };
      document.body.appendChild(f);
    });
  }
  return inFrame("jr-render-frame").then(function (seen) {
    check("render frame: a 10-turn history page is asked 100 at a time, other requests as they are",
      /num_turns=100&include_has_versions=true$/.test(seen[0]) && seen[1] === "/backend-api/conversation/" + CONV &&
      /\?num_turns=100&/.test(seen[2]), JSON.stringify(seen));
    check("render frame: a message sent from it is refused, the page told (user 11-21: its panel on the page sends nothing)",
      seen.send === "refused 1" && seen.length === 3, seen.send + " " + seen.length);
    return inFrame("");
  }).then(function (seen) {
    check("another frame of the site: untouched", /num_turns=10&/.test(seen[0]), JSON.stringify(seen));
    // a copy opened at an answer (#jr-before=<the next question>): its first page is the page that ends with that answer
    return new Promise(function (done) {
      var f = document.createElement("iframe");
      f.className = "jr-render-frame";
      var B = "aaaaaaaa-1111-2222-3333-444444444444";
      f.srcdoc = '<script>location.hash = "jr-before=' + B + '"; window.fetch = function (u) { u = String(typeof u === "string" ? u : u.url);' +
        ' var body = /before=/.test(u) ? { messages: [{ id: "q5" }, { id: "a5" }], page_info: { has_previous_page: true, has_next_page: true } }' +
        ' : { title: "T", messages: [{ id: "q9" }, { id: "a9" }], current_node: "a9", page_info: { has_previous_page: true, has_next_page: false } };' +
        ' return Promise.resolve(new Response(JSON.stringify(body), { headers: { "content-type": "application/json" } })); };<\/script>' +
        '<script src="../src/net-tap.js"><\/script>';
      f.onload = function () {
        f.contentWindow.fetch("/backend-api/conversations/" + CONV + "?num_turns=10").then(function (r) { return r.json(); }).then(function (j) {
          check("a copy opened at an answer: its first page ends with that answer (drawn last, no scrolling to it)",
            j.messages.map(function (m) { return m.id; }).join() === "q5,a5" && j.current_node === "a5" && j.title === "T" && j.page_info.has_next_page === false,
            JSON.stringify(j));
          f.remove(); done();
        });
      };
      document.body.appendChild(f);
    });
  });
}).catch(function (e) { check("no error", false, e && e.message); }).then(function () {
  out.push(failed ? failed + " FAILED" : "all passed");
  document.getElementById("out").textContent = out.join("\n");
  document.title = failed ? "FAIL" : "PASS";
});
</script>
</body></html>
